# ---------------------------------------------------------------------------
# Benchmarks
# ---------------------------------------------------------------------------
benchmarks:
  primary:
    name: S&P/ASX 200 (price index via ETF proxy ^AXJO)
    source_ticker: "^AXJO"
    type: price_index          # ^AXJO excludes dividends; see docs/limitations
  total_return_proxy:
    name: Vanguard Australian Shares Index ETF
    source_ticker: "VAS.AX"
    type: etw_total_return_proxy   # distributions included via adj close
  equal_weight_universe:
    name: Equal-weighted eligible universe
    type: synthetic
