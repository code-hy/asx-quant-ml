# =============================================================================
# universe.yaml — security universe definition
# =============================================================================
# Phase 2 will build the security master. Universe construction is
# config-driven so the constituent set can be swapped without code changes.

universe:
  name: asx200_current_proxy
  # CURRENT_CONSTITUENT_PROXY: today's constituent list applied across history.
  # This introduces survivorship bias, which MUST be disclosed in reports.
  # Alternatives for Phase 2+: "manual_list", "sector_balanced_manual".
  methodology: current_constituent_proxy

  target_size: 200
  min_size: 150            # accept fewer if data quality filters bite

  exchange: ASX
  currency: AUD
  instrument_type: ordinary_share

  # Eligibility filters applied at each rebalance date (see portfolio.yaml
  # for liquidity thresholds). History filters belong to the pipeline.
  eligibility:
    min_history_sessions: 250    # ~1 year of trading
    require_active: true

  # ---------------------------------------------------------------------------
  # Seed list used until a constituent source is wired in Phase 2.
  # Illustrative, cross-sector; NOT a certified ASX 200 constituent list.
  # Sourced tickers use Yahoo's ".AX" suffix convention.
  # ---------------------------------------------------------------------------
